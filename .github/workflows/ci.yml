name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dependances
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint -w apps/api

      - name: Format
        run: npm run format:check -w apps/api

      - name: Test unitaires
        run: npm test -w apps/api

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dependances
        run: npm ci --ignore-scripts

      - name: Test d'integration (testcontainers)
        run: npm run test:db -w apps/api

  history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Récupérer le code (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Node (version de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Messages de commit (commitlint)
        run: |
          FORK_POINT=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          npx commitlint --from "$FORK_POINT" --to "$HEAD_SHA" --verbose

      - name: Migrations déjà mergées inchangées
        run: |
          FORK_POINT=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed=$(git diff --no-renames --name-only --diff-filter=MD "$FORK_POINT" "$HEAD_SHA" -- apps/api/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Migration déjà mergée modifiée ou supprimée (ADR-021) :"
            echo "$changed"
            exit 1
          fi
  image:
    needs: [verify, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # id-token : uniquement pour les étapes de push, qui ne tournent que sur main.
    # Les permissions d'un job remplacent celles du workflow : contents: read est répété.
    permissions:
      contents: read
      id-token: write
    # Les digests poussés, lus par le job deploy (commit 2)
    outputs:
      api-ref: ${{ steps.push.outputs.api-ref }}
      migrate-ref: ${{ steps.push.outputs.migrate-ref }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Generer des identifiants jetables
        run: |
          {
            echo "DB_USER=gatekeeper"
            echo "DB_NAME=gatekeeper"
            echo "DB_PORT=5433"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Construire les images (version de Node de .nvmrc)
        run: docker compose build --build-arg NODE_VERSION="$(cat .nvmrc)"

      - name: Reperer l'image de l'API
        run: echo "API_IMAGE=$(docker compose config --images | grep -- '-api$')" >> "$GITHUB_ENV"

      - name: Scanner l'image (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore.yaml

      - name: Demarer la pile
        run: docker compose up -d --no-build

      - name: Attendre que l'API soit pret
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/health/ready

      - name: Smoke test (route metier)
        run: curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/events | grep -q '"items"'

      - name: Verifier l'utilisateur non-root
        run: test "$(docker compose exec -T api whoami)" = "node"
      
      - name: Connexion à Azure (OIDC, main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Pousser les images testées (tag = SHA, sortie = digest)
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RG: rg-gatekeeper-dev
        run: |
          ACR="$(az acr list -g "$RG" --query '[0].loginServer' -o tsv)"
          test -n "$ACR"
          az acr login -n "${ACR%%.*}"
          TAG="${GITHUB_SHA::12}"
          for name in api migrate; do
            local_image="$(docker compose config --images | grep -- "-$name\$")"
            docker tag "$local_image" "$ACR/gatekeeper-$name:$TAG"
            docker push "$ACR/gatekeeper-$name:$TAG"
            ref="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$ACR/gatekeeper-$name:$TAG" | grep "^$ACR/gatekeeper-$name@")"
            echo "$name : $ref"
            echo "$name-ref=$ref" >> "$GITHUB_OUTPUT"
          done
                
      - name: Journaux en cas d'echec
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200


  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Installer Terraform (même version que le poste)
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9" # plancher dans infra/versions.tf

      - name: Format
        run: terraform fmt -check -recursive -diff
        working-directory: infra

      - name: Initialiser sans backend
        run: terraform init -backend=false -input=false
        working-directory: infra

      - name: Valider
        run: terraform validate
        working-directory: infra