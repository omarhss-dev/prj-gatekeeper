x-database-url: &database-url postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
services:
  #----------------------postgres--------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" #format complet est IP_hôte:port_hôte:port_conteneur
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gatekeeper_net

  #-----------------------------redis----------------------------------

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gatekeeper_net

#--------------------migrate-------------------------------
  migrate: 
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gatekeeper_net

#--------------------api-----------------------------------
  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - gatekeeper_net

networks:
  gatekeeper_net:
    driver: bridge

volumes:
  postgres_data:
